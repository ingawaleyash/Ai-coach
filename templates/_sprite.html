{% comment %}
Inline SVG sprite.

This MUST be inlined in the document (rather than referenced as an
external file) because browsers block <use href="external.svg#id">
under the page's Content-Security-Policy.

Icons are used as:
    <svg class="ic ic-lg"><use href="#i-name"/></svg>

Sizing and colour come from /static/css/icons.css.
{% endcomment %}
